<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Sree Varshan's desktop: a Hyprland session with a terminal, system info and a btop panel">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#0b1e3a"/>
      <stop offset="1" stop-color="#0b3b66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#38bdf8" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>

    <clipPath id="c1"><rect x="40" y="100" height="26" width="0"><animate attributeName="width" from="0" to="120" begin="0.4s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="162" height="26" width="0"><animate attributeName="width" from="0" to="170" begin="1.6s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="224" height="26" width="0"><animate attributeName="width" from="0" to="170" begin="3.0s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="286" height="26" width="0"><animate attributeName="width" from="0" to="340" begin="4.4s" dur="1.0s" fill="freeze"/></rect></clipPath>
  </defs>

  <style>
    text { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "DejaVu Sans Mono", ui-monospace, monospace; }
    .t   { font-size: 15px; fill: #e2e8f0; }
    .p   { fill: #38bdf8; font-weight: 700; }
    .o   { font-size: 15px; fill: #94a3b8; }
    .hi  { fill: #7dd3fc; }
    .dir { fill: #38bdf8; font-weight: 700; }
    .ok  { fill: #4ade80; }
    .s   { font-size: 12.5px; fill: #cbd5e1; }
    .k   { fill: #38bdf8; font-weight: 700; }
    .dim { fill: #64748b; font-size: 12px; }
  </style>

  <!-- wallpaper -->
  <rect width="1000" height="500" fill="url(#wall)"/>
  <rect width="1000" height="500" fill="url(#dots)"/>
  <rect width="1000" height="500" fill="url(#glow)"/>

  <!-- waybar -->
  <rect x="16" y="12" width="968" height="32" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b"/>
  <g font-size="12" text-anchor="middle">
    <rect x="28" y="20" width="18" height="16" rx="5" fill="#1e293b"/><text x="37" y="32" class="dim">1</text>
    <rect x="52" y="20" width="34" height="16" rx="5" fill="#38bdf8"><animate attributeName="width" values="18;34" dur="0.4s" fill="freeze"/></rect><text x="69" y="32" fill="#0f172a" font-weight="700" font-size="12">2</text>
    <rect x="92" y="20" width="18" height="16" rx="5" fill="#1e293b"/><text x="101" y="32" class="dim">3</text>
    <rect x="116" y="20" width="18" height="16" rx="5" fill="#1e293b"/><text x="125" y="32" class="dim">4</text>
    <rect x="140" y="20" width="18" height="16" rx="5" fill="#1e293b"/><text x="149" y="32" class="dim">5</text>
  </g>
  <text x="500" y="33" text-anchor="middle" font-size="13" fill="#cbd5e1"><tspan class="k">sreevarshan</tspan>@xenoz <tspan fill="#64748b">: ~/projects</tspan></text>
  <text x="970" y="33" text-anchor="end" font-size="12" fill="#94a3b8">arch <tspan fill="#38bdf8">·</tspan> hyprland <tspan fill="#38bdf8">·</tspan> rust <tspan fill="#38bdf8">·</tspan> uptime ∞</text>

  <!-- terminal (focused window) -->
  <rect x="16" y="58" width="580" height="426" rx="12" fill="#0b1120" fill-opacity="0.94" stroke="#38bdf8" stroke-width="2"/>
  <text x="34" y="82" class="dim">kitty — ~/</text>
  <line x1="16" y1="92" x2="596" y2="92" stroke="#1e293b"/>

  <g clip-path="url(#c1)"><text x="40" y="118" class="t"><tspan class="p">❯ </tspan>whoami</text></g>
  <text x="40" y="144" class="o" opacity="0"><tspan class="hi">Sree Varshan V</tspan> — systems &amp; AI engineer<set attributeName="opacity" to="1" begin="1.1s" fill="freeze"/></text>

  <g clip-path="url(#c2)"><text x="40" y="180" class="t"><tspan class="p">❯ </tspan>cat focus.txt</text></g>
  <text x="40" y="206" class="o" opacity="0">local-first AI · rust tooling · on-device inference<set attributeName="opacity" to="1" begin="2.5s" fill="freeze"/></text>

  <g clip-path="url(#c3)"><text x="40" y="242" class="t"><tspan class="p">❯ </tspan>ls ~/shipping</text></g>
  <text x="40" y="268" class="o" opacity="0"><tspan class="dir">xencode/</tspan>  <tspan class="dir">pocketdesk/</tspan>  <tspan class="dir">codehalo/</tspan>  <tspan class="dir">fluxbond/</tspan><set attributeName="opacity" to="1" begin="3.9s" fill="freeze"/></text>

  <g clip-path="url(#c4)"><text x="40" y="304" class="t"><tspan class="p">❯ </tspan>xencode --model qwen-coder:local</text></g>
  <text x="40" y="330" class="o" opacity="0"><tspan class="hi">◆</tspan> provider   llama.cpp <tspan fill="#64748b">(offline)</tspan><set attributeName="opacity" to="1" begin="5.6s" fill="freeze"/></text>
  <text x="40" y="354" class="o" opacity="0"><tspan class="hi">◆</tspan> agent ready — your code never leaves this machine<set attributeName="opacity" to="1" begin="6.0s" fill="freeze"/></text>
  <text x="40" y="378" class="o" opacity="0"><tspan class="ok">✓</tspan> 20 crates · ~3,000 tests · approval-gated tools<set attributeName="opacity" to="1" begin="6.4s" fill="freeze"/></text>

  <g opacity="0">
    <set attributeName="opacity" to="1" begin="6.9s" fill="freeze"/>
    <text x="40" y="418" class="t"><tspan class="p">❯ </tspan></text>
    <rect x="62" y="405" width="9" height="17" fill="#38bdf8">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- fastfetch window -->
  <rect x="612" y="58" width="372" height="250" rx="12" fill="#0b1120" fill-opacity="0.88" stroke="#1e293b" stroke-width="2"/>
  <text x="630" y="82" class="dim">fastfetch</text>
  <line x1="612" y1="92" x2="984" y2="92" stroke="#1e293b"/>
  <text xml:space="preserve" font-size="12" fill="#38bdf8" font-weight="700">
    <tspan x="628" y="118">       /\</tspan>
    <tspan x="628" y="133">      /  \</tspan>
    <tspan x="628" y="148">     /    \</tspan>
    <tspan x="628" y="163">    /      \</tspan>
    <tspan x="628" y="178">   /   ,,   \</tspan>
    <tspan x="628" y="193">  /   |  |   \</tspan>
    <tspan x="628" y="208"> /_-''    ''-_\</tspan>
  </text>
  <text xml:space="preserve" class="s">
    <tspan x="752" y="118" class="k">sree</tspan><tspan>@</tspan><tspan class="k">xenoz</tspan>
    <tspan x="752" y="136" fill="#334155">───────────────────</tspan>
    <tspan x="752" y="156" class="k">os</tspan><tspan>     arch linux</tspan>
    <tspan x="752" y="176" class="k">wm</tspan><tspan>     hyprland</tspan>
    <tspan x="752" y="196" class="k">editor</tspan><tspan> neovim</tspan>
    <tspan x="752" y="216" class="k">lang</tspan><tspan>   rust py ts go</tspan>
    <tspan x="752" y="236" class="k">mode</tspan><tspan>   local-first</tspan>
  </text>
  <g>
    <rect x="752" y="256" width="22" height="14" fill="#0f172a" stroke="#334155"/>
    <rect x="776" y="256" width="22" height="14" fill="#1e293b"/>
    <rect x="800" y="256" width="22" height="14" fill="#0b3b66"/>
    <rect x="824" y="256" width="22" height="14" fill="#0369a1"/>
    <rect x="848" y="256" width="22" height="14" fill="#0ea5e9"/>
    <rect x="872" y="256" width="22" height="14" fill="#38bdf8"/>
    <rect x="896" y="256" width="22" height="14" fill="#7dd3fc"/>
    <rect x="920" y="256" width="22" height="14" fill="#f8fafc"/>
  </g>

  <!-- btop window -->
  <rect x="612" y="320" width="372" height="164" rx="12" fill="#0b1120" fill-opacity="0.88" stroke="#1e293b" stroke-width="2"/>
  <text x="630" y="344" class="dim">btop — where the cycles go</text>
  <line x1="612" y1="354" x2="984" y2="354" stroke="#1e293b"/>

  <g class="s">
    <text x="630" y="380" class="s">xencode</text>
    <text x="630" y="404" class="s">pocketdesk</text>
    <text x="630" y="428" class="s">riya</text>
  </g>
  <rect x="728" y="372" width="196" height="8" rx="4" fill="#1e293b"/>
  <rect x="728" y="396" width="196" height="8" rx="4" fill="#1e293b"/>
  <rect x="728" y="420" width="196" height="8" rx="4" fill="#1e293b"/>
  <rect x="728" y="372" width="0" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" from="0" to="82" begin="0.8s" dur="1.4s" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1" fill="freeze"/></rect>
  <rect x="728" y="396" width="0" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" from="0" to="65" begin="1.0s" dur="1.4s" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1" fill="freeze"/></rect>
  <rect x="728" y="420" width="0" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" from="0" to="49" begin="1.2s" dur="1.4s" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1" fill="freeze"/></rect>
  <text x="966" y="380" text-anchor="end" class="s">42%</text>
  <text x="966" y="404" text-anchor="end" class="s">33%</text>
  <text x="966" y="428" text-anchor="end" class="s">25%</text>

  <polyline points="630,470 652,462 674,466 696,452 718,458 740,446 762,454 784,440 806,450 828,444 850,456 872,442 894,448 916,438 938,446 966,440"
            fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
            stroke-dasharray="420" stroke-dashoffset="420">
    <animate attributeName="stroke-dashoffset" from="420" to="0" begin="1.4s" dur="2.2s" fill="freeze"/>
  </polyline>
</svg>
