<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="56" viewBox="0 0 1000 56" role="img" aria-label="Fig. 3 · Selected Work: six public projects, each drawn from its own file tree."><style>@font-face{font-family:'M';src:url(data:font/woff2;base64,) format('woff2')}.m{font-family:'M',ui-monospace,monospace}@font-face{font-family:'MM';src:url(data:font/woff2;base64,) format('woff2')}.mm{font-family:'MM',ui-monospace,monospace}@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(16px)}}@keyframes grow{from{stroke-dasharray:1 2;stroke-dashoffset:1.02}to{stroke-dasharray:1 2;stroke-dashoffset:0}}@keyframes ping{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4.5)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes type{from{transform:scaleX(0)}}@keyframes odo{from{transform:translateY(0)}}.fd{animation:fade .8s ease-out var(--t) backwards}.tw{transform-box:fill-box;transform-origin:0 0;animation-name:type;animation-fill-mode:backwards}.odo{animation-name:odo;animation-timing-function:cubic-bezier(.12,.8,.18,1);animation-fill-mode:backwards}.ping{opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 1.3s cubic-bezier(.16,1,.3,1) var(--t)}.run{animation:fin var(--e) linear forwards}@keyframes fin{0%,99.9%{display:inline}100%{display:none}}.done{animation:off var(--e) linear backwards}@keyframes off{from,to{display:none}}.hl{transform-origin:0 0;animation:hl 1.6s cubic-bezier(.16,1,.3,1) .6s backwards}@keyframes hl{from{transform:scaleX(0)}}.fuse{transform:translateX(-100px);animation:fuse 10s cubic-bezier(.45,.05,.25,1) 4.00s infinite}@keyframes fuse{0%{transform:translateX(-100px)}26%{transform:translateX(1100px)}100%{transform:translateX(1100px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="-90" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#c2410c" stop-opacity="0"/><stop offset="1" stop-color="#c2410c"/></linearGradient><mask id="tm1" maskUnits="userSpaceOnUse" x="-2" y="8.8" width="195.4" height="19.2"><rect class="tw" x="-2" y="8.8" width="195.4" height="19.2" fill="#fff" style="animation-duration:0.46s;animation-delay:0.90s;animation-timing-function:steps(22)"/></mask><mask id="tm2" maskUnits="userSpaceOnUse" x="528.2" y="8.8" width="473.8" height="19.2"><rect class="tw" x="528.2" y="8.8" width="473.8" height="19.2" fill="#fff" style="animation-duration:0.68s;animation-delay:1.30s;animation-timing-function:steps(54)"/></mask></defs><text class="mm run" x="0" y="22" font-size="12" letter-spacing="1.5" fill="#1f2328" style="--e:1.41s" mask="url(#tm1)">FIG. 3 · SELECTED WORK</text><text class="mm done" x="0" y="22" font-size="12" letter-spacing="1.5" fill="#1f2328" style="--e:1.41s">FIG. 3 · SELECTED WORK</text><text class="m run" x="530.2" y="22" font-size="12" letter-spacing="1.5" fill="#59636e" style="--e:2.02s" mask="url(#tm2)">SIX PUBLIC PROJECTS, EACH DRAWN FROM ITS OWN FILE TREE</text><text class="m done" x="530.2" y="22" font-size="12" letter-spacing="1.5" fill="#59636e" style="--e:2.02s">SIX PUBLIC PROJECTS, EACH DRAWN FROM ITS OWN FILE TREE</text><path class="hl" d="M0 40H1000" stroke="#d1d9e0"/><g class="fuse"><path d="M-90 40h90" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/><circle cy="40" r="7" fill="#c2410c" fill-opacity=".22"/><circle cy="40" r="2.4" fill="#2a0f05"/></g></svg>
