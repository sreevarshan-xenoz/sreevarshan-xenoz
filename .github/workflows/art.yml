name: Draw profile art

on:
  schedule:
    - cron: "17 0 * * *" # every night, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/art.yml"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install type and image tools
        run: pip install fonttools brotli uharfbuzz pillow

      - name: Draw every figure
        run: python scripts/render.py dist --readme README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fig. 5 lives inside the README, so a new week means a small README commit
      - name: Keep the 3D year in the README current
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh the 3D year" -- README.md
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Redraw profile art
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
