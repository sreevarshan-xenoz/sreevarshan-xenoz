name: Draw profile art

on:
  schedule:
    - cron: "17 0 * * *" # every night, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/art.yml"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install type and image tools
        run: pip install fonttools brotli uharfbuzz pillow

      - name: Draw the year ring and project cards
        run: python scripts/render.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Redraw profile art
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
